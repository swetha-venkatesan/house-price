<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        function showForm() {
            document.getElementById("landing").style.display = "none";
            document.getElementById("form-section").style.display = "flex";
        }
    </script>
</head>
<body>
    <!-- Landing Section -->
    <div id="landing" class="landing">
        <div class="landing-content">
            <h1>🏠 Welcome to Smart House Price Predictor</h1>
            <p>Estimate your dream home price instantly with AI.</p>
            <button onclick="showForm()" class="btn">Get Started</button>
        </div>
    </div>
    <div id="form-section" class="container" style="display:none;">
        <div class="form-card">
            <h2>Enter House Details</h2>
            <form action="{{ url_for('predict') }}" method="post">
                <label for="area">Area (sq ft):</label>
                <input type="number" id="area" name="area" required>

                <label for="bedrooms">Bedrooms:</label>
                <input type="number" id="bedrooms" name="bedrooms" required>

                <label for="bathrooms">Bathrooms:</label>
                <input type="number" id="bathrooms" name="bathrooms" required>

                <label for="stories">Stories:</label>
                <input type="number" id="stories" name="stories" required>

                <label>Main Road:</label>
                <input type="radio" name="mainroad" value="yes" required> Yes
                <input type="radio" name="mainroad" value="no"> No 

                <label>Guest Room:</label>
                <input type="radio" name="guestroom" value="yes" required> Yes
                <input type="radio" name="guestroom" value="no"> No 

                <label>Basement:</label>
                <input type="radio" name="basement" value="yes" required> Yes
                <input type="radio" name="basement" value="no"> No 

                <label>Hot Water Heating:</label>
                <input type="radio" name="hotwaterheating" value="yes" required> Yes
                <input type="radio" name="hotwaterheating" value="no"> No 

                <label>Air Conditioning:</label>
                <input type="radio" name="airconditioning" value="yes" required> Yes
                <input type="radio" name="airconditioning" value="no"> No 

                <label for="parking">Parking:</label>
                <input type="number" id="parking" name="parking" required>

                <label>Preferred Area:</label>
                <input type="radio" name="prefarea" value="yes" required> Yes
                <input type="radio" name="prefarea" value="no"> No 

                <label>Furnishing Status:</label>
                <input type="radio" name="furnishingstatus" value="furnished" required> Furnished
                <input type="radio" name="furnishingstatus" value="semi-furnished"> Semi-Furnished
                <input type="radio" name="furnishingstatus" value="unfurnished"> Unfurnished 

                <input type="submit" value="💡 Predict Price" class="btn">
            </form>
        </div>
    </div>
</body>
</html>
